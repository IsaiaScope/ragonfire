name: smoke

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pg-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: |
          bash -n rag-anything/bootstrap.sh rag-anything/scripts/*.sh rag-anything/scripts/lib/*.sh infra/os/*.sh infra/postgres/entrypoint-loop.sh tests/*.sh
          python3 -m py_compile rag-anything/scripts/ingest.py rag-anything/scripts/ragonfire_runtime.py tests/test_ragonfire_runtime.py
          python3 tests/test_ragonfire_runtime.py
          bash tests/runtime-helper-test.sh

      - name: Build postgres image
        run: |
          docker build -t postgres infra/postgres

      - name: Create throwaway .img and run phase-1 smoke
        run: |
          chmod +x tests/phase1-smoke.sh
          ./tests/phase1-smoke.sh
